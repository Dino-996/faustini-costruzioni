<div class="w-full p-4 mb-6">
    <div class="relative flex justify-between items-end">
        <!-- Linea di connessione con gradiente -->
        <div
            class="absolute h-[3px] bg-gradient-to-r from-black/20 via-black/60 to-black/20 left-0 right-0 bottom-4 rounded-full">
        </div>

        <!-- Steps -->
        @for(step of steps(); track step.id) {
        <div class="relative z-10 flex flex-col items-center max-w-[100px] transform transition-transform hover:translate-y-[-5px] duration-300 cursor-pointer"
            [attr.aria-label]="'Step ' + (step.id + 1) + ': ' + step.description" role="button" tabindex="0">

            <!-- Descrizione -->
            <span class="text-xs md:text-sm text-center text-[#191A19] font-bold mb-2 px-1">
                {{ step.description }}
            </span>

            <!-- Punto con animazione -->
            <div class="relative mb-2">
                <div class="h-4 w-4 bg-[#FF7420] border-2 border-white rounded-full shadow-lg"></div>
                <div class="absolute top-0 left-0 h-4 w-4 border-2 border-white rounded-full animate-ping opacity-50">
                </div>
            </div>

            <!-- Titolo -->
            <span class="text-xs font-bold text-white bg-gray-900 px-2 py-1 rounded-full shadow-sm">
                Step {{ step.id + 1 }}
            </span>
        </div>
        }
    </div>
</div>
