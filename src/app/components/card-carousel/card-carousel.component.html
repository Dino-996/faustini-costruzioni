<!-- Carousel migliorato -->
<div class="relative w-full mx-auto p-2 sm:p-4 bg-transparent">
    <div class="w-full max-w-7xl mx-auto overflow-hidden touch-pan-x">
        <!-- Track del carousel -->
        <div #carouselTrack class="flex will-change-transform" (mousedown)="startDragging($event)"
            (touchstart)="startDragging($event)" [style.transform]="'translateX(' + position + 'px)'">
            @for(card of cards; track card.id) {
            <div [class]="getCardWidth()">
                <div
                    class="mx-2 sm:mx-3 bg-white border border-gray-100 rounded-xl sm:rounded-2xl shadow-xl overflow-hidden cursor-grab active:cursor-grabbing transform transition-all duration-300 hover:shadow-2xl hover:-translate-y-1 group">
                    <!-- Immagine card -->
                    <div class="relative overflow-hidden">
                        <img [src]="card.imageUrl" [alt]="card.title"
                            class="w-full h-40 sm:h-48 md:h-56 object-cover select-none transition-transform duration-500 group-hover:scale-105"
                            draggable="false">
                    </div>
                    <div class="p-3 sm:p-5">
                        <h3
                            class="text-gray-900 text-lg sm:text-xl font-bold mb-2 sm:mb-3 select-none transition-colors duration-300">
                            {{ card.title }}</h3>
                        <p class="text-gray-700 select-none mb-3 sm:mb-4 text-sm sm:text-base">{{ card.description }}
                        </p>
                        <div class="flex justify-between items-center mt-2 sm:mt-4">
                            <!-- Location -->
                            <div class="flex items-start text-gray-600 text-xs sm:text-sm">
                                <ng-icon name="heroMapPin" size="16" class="shrink-0 mr-1" />
                                <span>{{ card.location || 'Località' }}</span>
                            </div>
                            <!-- Pulsante Visita -->
                            
                            <button [routerLink]="card.buttonLink"
                            class="text-nowrap flex items-center px-4 py-2 bg-transparent text-[#C2410C] border border-[#C2410C] rounded-xl hover:bg-[#C2410C] hover:text-white cursor-pointer transition-all duration-300 group mt-auto">
                            <span class="font-medium">Scopri di più</span>
                            <ng-icon name="heroArrowRight" size="16" class="shrink-0 ml-2 transition-transform duration-300 group-hover:translate-x-1" />
                        </button>
                        </div>
                    </div>
                </div>
            </div>
            }
        </div>

        <!-- Bottom controls wrapper -->
        <div class="mt-4 sm:mt-6 flex flex-col sm:flex-row justify-between items-center px-2 sm:px-3">
            <!-- Indicatori di navigazione -->
            <div class="flex justify-center gap-2 sm:gap-4 mb-3 sm:mb-0 order-2 sm:order-1">
                @for(i of getIndicators(); track i) {
                <button (click)="navigateToSlide(i)"
                    [attr.aria-label]="'Vai alla slide ' + (i + 1)"
                    [class]="currentSlide === i  ? 'w-12 sm:w-8 h-3 sm:h-2 bg-gray-800 rounded-full transition-all duration-300 relative after:absolute after:-inset-4' : 'w-4 h-3 sm:h-2 bg-gray-300 rounded-full transition-all duration-300 hover:bg-[#FF7420]/70 cursor-pointer relative after:absolute after:-inset-4'">
                </button>
                }
            </div>

            <div class="order-1 sm:order-2 mb-3 sm:mb-0 w-full sm:w-auto flex justify-center sm:justify-end">
                <button (click)="onProgetto()" class="flex items-center px-6 py-3 bg-white text-gray-900 border border-gray-200 hover:border-gray-300 hover:bg-gray-50 rounded-2xl cursor-pointer transition-all duration-300 shadow-sm hover:shadow-md transform hover:-translate-y-1 group">
                <span class="text-nowrap font-medium">Esplora tutti i progetti</span>
                <ng-icon name="heroArrowRightEndOnRectangle" size="18" class="ml-3 text-[#C2410C] transition-transform duration-300 group-hover:translate-x-1" />
            </button>
            </div>
        </div>
    </div>
</div>
