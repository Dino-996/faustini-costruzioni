<div class="relative w-full max-w-4xl mx-auto">
    <!-- Video Container -->
    <div class="relative bg-black rounded-2xl overflow-hidden shadow-2xl group">

        <!-- Video Element -->
        <video #videoElement class="w-full aspect-video object-cover transition-opacity duration-300"
            [poster]="config().poster" controls preload="metadata" (play)="onPlay()" (pause)="onPause()"
            (loadedmetadata)="onLoadedMetadata()" (error)="onError($event)" controls controlsList="nodownload">

            <source [src]="config().src" type="video/mp4">
            <p class="text-white p-4">
                Il tuo browser non supporta i video HTML5.
            </p>
        </video>

        <!-- Poster/Thumbnail con Play Button -->
        @if (!playingState() && !errorState()) {
        <div role="button" tabindex="0" aria-label="Riproduci video" class="absolute inset-0 cursor-pointer flex items-center justify-center bg-black/20 group-hover:bg-black/30 transition-colors duration-300" (click)="playVideo(videoElement)" (keydown.enter)="playVideo(videoElement)">

            <!-- Play Button -->
            <div class="relative z-10 bg-[#FF7420] rounded-full p-6 shadow-2xl transform group-hover:scale-110 transition-transform duration-300">
                <svg class="w-12 h-12 text-white ml-1" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M8 5v14l11-7z" />
                </svg>
            </div>

        </div>
        }

        <!-- Loading State -->
        @if (loadingState()) {
        <div class="absolute inset-0 flex items-center justify-center bg-black/50">
            <div class="flex flex-col items-center gap-4">
                <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-[#FF7420]"></div>
                <p class="text-white text-sm">Caricamento video...</p>
            </div>
        </div>
        }

        <!-- Error State -->
        @if (errorState()) {
        <div class="aspect-video flex items-center justify-center bg-gray-900 text-white p-8 text-center">
            <div class="max-w-md">
                <svg class="w-16 h-16 text-red-400 mx-auto mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
                <h3 class="text-lg font-semibold mb-2">Errore nel caricamento</h3>
                <p class="text-gray-300 text-sm mb-4">Non è stato possibile caricare il video.</p>
                <button (click)="retryLoad(videoElement)"
                    class="bg-[#FF7420] text-white px-4 py-2 rounded-lg hover:bg-[#e6661c] transition-colors duration-300">
                    Riprova
                </button>
            </div>
        </div>
        }
    </div>
</div>
